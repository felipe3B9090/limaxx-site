<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limaxx - Site Exemplo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Seção de Cabeçalho -->
    <header class="hero-section">
        <div class="container">
            <h1>Bem-vindo ao Limaxx</h1>
            <p>Transformando ideias em soluções digitais.</p>
            <a href="#sobre" class="btn">Saiba Mais</a>
        </div>
    </header>

    <!-- Seção Sobre -->
    <section id="sobre" class="about-section">
        <div class="container">
            <h2>Sobre Nós</h2>
            <p>Somos uma equipe especializada em desenvolvimento web, focada em criar sites e soluções personalizadas para nossos clientes.</p>
        </div>
    </section>

    <!-- Seção de Contato -->
    <section id="contato" class="contact-section">
        <div class="container">
            <h2>Entre em Contato</h2>
            <form action="#">
                <input type="text" name="nome" placeholder="Seu Nome" required>
                <input type="email" name="email" placeholder="Seu Email" required>
                <textarea name="mensagem" placeholder="Sua Mensagem" required></textarea>
                <button type="submit" class="btn">Enviar</button>
            </form>
        </div>
    </section>

    <!-- Rodapé -->
    <footer class="footer">
        <p>&copy; 2025 Limaxx - Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
